name: ask-ledger
version: 0.2.0
manifest_version: 2
api_version: 1
description: Durable ledger of what you asked the agent, with reminders, a /asks view and a static page
license: MIT
requires_hermes: ">=0.22.6"
provides_tools: [ask_update, ask_list, todo_add, todo_update, todo_suggest, todo_list]
provides_hooks: [pre_llm_call, post_gateway_admission, transform_llm_output]
tags: [productivity, memory]
config_schema:
  board: {type: bool, default: true, label: "Show open todos board"}
  agent_adds: {type: bool, default: true, label: "Allow agent adds"}
  remind_after_minutes: {type: int, default: 30, label: "Remind after (minutes)", description: "Open asks older than this are listed in the agent's reminder"}
  max_lines: {type: int, default: 5, label: "Max reminder lines"}
  page_url: {type: str, default: "", label: "Page URL", description: "Optional URL where you serve the ledger page; default is the local file"}
  ntfy_url: {type: str, default: "", label: "ntfy topic URL", description: "Optional, https only. Sends only 'N things need you' and the page link"}
